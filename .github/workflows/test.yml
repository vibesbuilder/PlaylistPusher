name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (Node.js)
        run: |
          node --version
          npm test

      - name: Python syntax check
        run: python3 -m py_compile playlistpusher.py
